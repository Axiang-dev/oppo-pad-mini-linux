name: Kernel and device-tree build

on:
  pull_request:
    paths:
      - .github/workflows/kernel-build.yml
      - device/**
      - docs/sources.md
      - kernel/**
      - scripts/**
  push:
    branches: [main]
    paths:
      - .github/workflows/kernel-build.yml
      - device/**
      - docs/sources.md
      - kernel/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OPD2515_WORKDIR: ${{ runner.temp }}/opd2515-work
      OPD2515_ARTIFACT_DIR: ${{ runner.temp }}/opd2515-artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host dependencies
        run: ./scripts/setup.sh --install-deps

      - name: Fetch source and apply diagnostic baseline
        run: |
          ./scripts/fetch-sources.sh
          ./scripts/apply-patches.sh

      - name: Build ARM64 Image and OPD2515 DTB
        run: ./scripts/build-kernel.sh --kernel-only --no-fetch --no-patch
