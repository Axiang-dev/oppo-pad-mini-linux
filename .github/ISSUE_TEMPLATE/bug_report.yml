name: Software or build bug
description: Report a reproducible repository, build, or documentation defect.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include serial numbers, USB instance identifiers, MAC addresses, IMEI, secrets, vendor firmware, or full partition images.
  - type: input
    id: revision
    attributes:
      label: Repository revision
      description: Commit SHA or release tag used for the test.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Build tooling
        - Kernel patch application
        - Device tree
        - Initramfs
        - Image packaging
        - Documentation
        - CI
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest command sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include relevant error text and hashes. Remove private identifiers.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS, compiler, Python, Git, and other relevant versions.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed device-unique identifiers, credentials, proprietary firmware, and private logs.
          required: true
